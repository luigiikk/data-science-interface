<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Base de Dados Bibliográfica</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:        #0f0f13;
      --surface:   #17171e;
      --surface2:  #1f1f2a;
      --border:    #2a2a38;
      --accent:    #c8a96e;
      --accent2:   #7b8cde;
      --text:      #e8e4da;
      --muted:     #7a7a8c;
      --danger:    #e05c5c;
      --radius:    10px;
      --transition: 0.22s cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: .5;
    }

    .wrapper { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; }

    /* ── HEADER ── */
    header {
      padding: 48px 0 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
      display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .header-left h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .header-left h1 span { color: var(--accent); }
    .header-left p { color: var(--muted); font-size: .875rem; margin-top: 6px; }

    /* CONFIG PANEL */
    #config-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }
    #config-panel label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 6px; }
    #config-panel input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 14px;
      font-size: .875rem;
      font-family: 'DM Sans', sans-serif;
      transition: border-color var(--transition);
    }
    #config-panel input:focus { outline: none; border-color: var(--accent); }
    .btn-connect {
      background: var(--accent);
      color: #0f0f13;
      border: none;
      border-radius: 6px;
      padding: 10px 22px;
      font-size: .875rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
      white-space: nowrap;
    }
    .btn-connect:hover { opacity: .85; transform: translateY(-1px); }
    .connection-status {
      font-size: .8rem;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .connected { background: rgba(100,200,120,.12); color: #64c878; }
    .connected .status-dot { background: #64c878; box-shadow: 0 0 6px #64c878; }
    .disconnected { background: rgba(224,92,92,.1); color: var(--danger); }
    .disconnected .status-dot { background: var(--danger); }

    /* ── TABS ── */
    .tabs-nav {
      display: flex; gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      font-weight: 500;
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color var(--transition), border-color var(--transition);
      white-space: nowrap;
      display: flex; align-items: center; gap: 8px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-count {
      background: var(--surface2);
      color: var(--muted);
      font-size: .7rem;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .tab-btn.active .tab-count { background: rgba(200,169,110,.15); color: var(--accent); }

    .tab-pane { display: none; animation: fadeIn .3s ease; }
    .tab-pane.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ── SEARCH / FILTER BAR ── */
    .search-bar {
      display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .search-bar input, .search-bar select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 9px 14px;
      font-size: .875rem;
      font-family: 'DM Sans', sans-serif;
      transition: border-color var(--transition);
    }
    .search-bar input:focus, .search-bar select:focus { outline: none; border-color: var(--accent); }
    .search-bar input { flex: 1; min-width: 220px; }
    .search-bar select option { background: var(--surface); }

    /* ── TABLE ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    thead tr { background: var(--surface2); }
    th {
      text-align: left;
      padding: 13px 16px;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: color var(--transition);
    }
    th:hover { color: var(--text); }
    th.sorted { color: var(--accent); }
    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background var(--transition); }
    tbody tr:hover { background: var(--surface2); }

    /* ── BADGES ── */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 500;
    }
    .badge-blue { background: rgba(123,140,222,.15); color: var(--accent2); }
    .badge-gold { background: rgba(200,169,110,.12); color: var(--accent); }
    .badge-gray { background: var(--surface2); color: var(--muted); }
    .badge-green { background: rgba(100,200,120,.12); color: #64c878; }

    /* ── EXPAND ROW (artigos) ── */
    .expand-btn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 1rem; padding: 2px 6px;
      transition: color var(--transition);
    }
    .expand-btn:hover { color: var(--accent); }
    .detail-row td {
      background: #13131a;
      padding: 16px 20px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px 24px;
    }
    .detail-item label { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; margin-bottom: 3px; }
    .detail-item span { font-size: .85rem; }
    .resumo-text { font-size: .82rem; color: var(--muted); line-height: 1.7; margin-top: 10px; }
    .tags-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .detail-link { color: var(--accent); text-decoration: none; font-size: .82rem; }
    .detail-link:hover { text-decoration: underline; }

    /* ── LOADING / EMPTY ── */
    .state-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 20px; color: var(--muted); gap: 12px; text-align: center;
    }
    .state-box svg { opacity: .3; }
    .state-box p { font-size: .9rem; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PAGINATION ── */
    .pagination {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      font-size: .8rem; color: var(--muted);
      flex-wrap: wrap; gap: 10px;
    }
    .page-btns { display: flex; gap: 4px; }
    .page-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 5px; padding: 5px 11px;
      font-size: .8rem; cursor: pointer; transition: all var(--transition);
    }
    .page-btn:hover { border-color: var(--accent); color: var(--accent); }
    .page-btn.current { background: var(--accent); border-color: var(--accent); color: #0f0f13; font-weight: 600; }
    .page-btn:disabled { opacity: .3; cursor: default; }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      flex: 1; min-width: 140px;
    }
    .stat-card .num {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      color: var(--accent);
      line-height: 1;
    }
    .stat-card .lbl { font-size: .78rem; color: var(--muted); margin-top: 4px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      #config-panel { grid-template-columns: 1fr; }
      .stats-bar { gap: 10px; }
      td, th { padding: 10px 12px; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <h1>Base de Dados <span>Bibliográfica</span></h1>
      <p>Dashboard de consulta e visualização de artigos científicos</p>
    </div>
    <div id="conn-status" class="connection-status disconnected">
      <span class="status-dot"></span>
      <span id="conn-label">Desconectado</span>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-card"><div class="num" id="st-artigos">—</div><div class="lbl">Artigos</div></div>
    <div class="stat-card"><div class="num" id="st-autores">—</div><div class="lbl">Autores</div></div>
    <div class="stat-card"><div class="num" id="st-keywords">—</div><div class="lbl">Palavras-chave</div></div>
    <div class="stat-card"><div class="num" id="st-refs">—</div><div class="lbl">Referências</div></div>
  </div>

  <!-- TABS -->
  <nav class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('artigos',this)">
      📄 Artigos <span class="tab-count" id="cnt-artigos">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('autores',this)">
      👤 Autores <span class="tab-count" id="cnt-autores">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('keywords',this)">
      🏷️ Palavras-chave <span class="tab-count" id="cnt-keywords">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('referencias',this)">
      📚 Referências <span class="tab-count" id="cnt-referencias">0</span>
    </button>
  </nav>

  <!-- ===== ARTIGOS ===== -->
  <div id="tab-artigos" class="tab-pane active">
    <div class="search-bar">
      <input type="text" id="search-artigos" placeholder="Buscar por título, DOI, ISSN…" oninput="debounce(() => loadArtigos(1), 350)()" />
      <select id="filter-ano" onchange="loadArtigos(1)">
        <option value="">Todos os anos</option>
      </select>
      <select id="filter-tipo" onchange="loadArtigos(1)">
        <option value="">Todos os tipos</option>
      </select>
    </div>
    <div class="table-wrap">
      <table id="tbl-artigos">
        <thead><tr>
          <th style="width:36px;"></th>
          <th onclick="sortTable('artigos','titulo')">Título</th>
          <th onclick="sortTable('artigos','ano')">Ano</th>
          <th onclick="sortTable('artigos','source_title')">Fonte</th>
          <th onclick="sortTable('artigos','qtd_citacoes')">Citações</th>
          <th>Tipo</th>
          <th>Acesso</th>
        </tr></thead>
        <tbody id="body-artigos"></tbody>
      </table>
      <div id="pg-artigos" class="pagination" style="display:none"></div>
    </div>
  </div>

  <!-- ===== AUTORES ===== -->
  <div id="tab-autores" class="tab-pane">
    <div class="search-bar">
      <input type="text" id="search-autores" placeholder="Buscar por nome…" oninput="debounce(() => loadAutores(1), 350)()" />
    </div>
    <div class="table-wrap">
      <table id="tbl-autores">
        <thead><tr>
          <th onclick="sortTable('autores','id')">ID</th>
          <th onclick="sortTable('autores','nome')">Nome</th>
          <th onclick="sortTable('autores','nome_completo')">Nome Completo</th>
          <th>Artigos</th>
        </tr></thead>
        <tbody id="body-autores"></tbody>
      </table>
      <div id="pg-autores" class="pagination" style="display:none"></div>
    </div>
  </div>

  <!-- ===== KEYWORDS ===== -->
  <div id="tab-keywords" class="tab-pane">
    <div class="search-bar">
      <input type="text" id="search-keywords" placeholder="Buscar palavra-chave…" oninput="debounce(() => loadKeywords(1), 350)()" />
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th onclick="sortTable('keywords','id')">ID</th>
          <th onclick="sortTable('keywords','palavra_chave')">Palavra-chave</th>
          <th>Artigos</th>
        </tr></thead>
        <tbody id="body-keywords"></tbody>
      </table>
      <div id="pg-keywords" class="pagination" style="display:none"></div>
    </div>
  </div>

  <!-- ===== REFERÊNCIAS ===== -->
  <div id="tab-referencias" class="tab-pane">
    <div class="search-bar">
      <input type="text" id="search-referencias" placeholder="Buscar referência…" oninput="debounce(() => loadReferencias(1), 350)()" />
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:80px;" onclick="sortTable('referencias','id')">ID</th>
          <th onclick="sortTable('referencias','referencia')">Referência</th>
        </tr></thead>
        <tbody id="body-referencias"></tbody>
      </table>
      <div id="pg-referencias" class="pagination" style="display:none"></div>
    </div>
  </div>

</div><!-- /wrapper -->

<script>
/* ─────────────────────────────────────────
   STATE
───────────────────────────────────────── */
let sb = null;
const PAGE_SIZE = 25;
const state = {
  artigos:   { page: 1, sort: 'id', asc: true },
  autores:   { page: 1, sort: 'nome', asc: true },
  keywords:  { page: 1, sort: 'palavra_chave', asc: true },
  referencias:{ page: 1, sort: 'id', asc: true },
};
const expandedRows = new Set();

/* ─────────────────────────────────────────
   SUPABASE INIT
───────────────────────────────────────── */
async function initSupabase() {
  const url = document.getElementById('supa-url').value.trim();
  const key = document.getElementById('supa-key').value.trim();
  if (!url || !key) { alert('Preencha URL e Anon Key.'); return; }

  try {
    sb = window.supabase.createClient(url, key);
    // test connection
    const { error } = await sb.from('artigo').select('id', { count: 'exact', head: true });
    if (error) throw error;
    setConnected(true);
    loadAll();
    populateFilters();
  } catch(e) {
    setConnected(false);
    alert('Erro ao conectar: ' + e.message);
  }
}

function setConnected(v) {
  const el = document.getElementById('conn-status');
  const lbl = document.getElementById('conn-label');
  el.className = 'connection-status ' + (v ? 'connected' : 'disconnected');
  lbl.textContent = v ? 'Conectado' : 'Desconectado';
}

/* ─────────────────────────────────────────
   LOAD ALL / STATS
───────────────────────────────────────── */
async function loadAll() {
  await Promise.all([loadArtigos(1), loadAutores(1), loadKeywords(1), loadReferencias(1)]);
  loadStats();
}

async function loadStats() {
  const tables = ['artigo','autor','palavras_chaves','referencias'];
  const ids = ['st-artigos','st-autores','st-keywords','st-refs'];
  for (let i = 0; i < tables.length; i++) {
    const { count } = await sb.from(tables[i]).select('*', { count: 'exact', head: true });
    document.getElementById(ids[i]).textContent = (count ?? 0).toLocaleString('pt-BR');
  }
}

/* ─────────────────────────────────────────
   FILTER POPULATION
───────────────────────────────────────── */
async function populateFilters() {
  // Anos
  const { data: anos } = await sb.from('artigo').select('ano').not('ano','is',null).order('ano',{ascending:false});
  const unique = [...new Set((anos||[]).map(r=>r.ano))];
  const selAno = document.getElementById('filter-ano');
  unique.forEach(a => { const o = document.createElement('option'); o.value=a; o.textContent=a; selAno.appendChild(o); });

  // Tipos
  const { data: tipos } = await sb.from('artigo').select('tipo_documento').not('tipo_documento','is',null);
  const uTipos = [...new Set((tipos||[]).map(r=>r.tipo_documento))];
  const selTipo = document.getElementById('filter-tipo');
  uTipos.forEach(t => { const o = document.createElement('option'); o.value=t; o.textContent=t; selTipo.appendChild(o); });
}

/* ─────────────────────────────────────────
   ARTIGOS
───────────────────────────────────────── */
async function loadArtigos(page = 1) {
  if (!sb) return;
  state.artigos.page = page;
  const body = document.getElementById('body-artigos');
  body.innerHTML = `<tr><td colspan="7"><div class="state-box"><div class="spinner"></div><p>Carregando…</p></div></td></tr>`;

  const search = document.getElementById('search-artigos').value.trim();
  const ano    = document.getElementById('filter-ano').value;
  const tipo   = document.getElementById('filter-tipo').value;
  const from   = (page - 1) * PAGE_SIZE;
  const to     = from + PAGE_SIZE - 1;

  let q = sb.from('artigo').select('*', { count: 'exact' });
  if (search) q = q.or(`titulo.ilike.%${search}%,doi.ilike.%${search}%,issn.ilike.%${search}%`);
  if (ano)    q = q.eq('ano', ano);
  if (tipo)   q = q.eq('tipo_documento', tipo);
  q = q.order(state.artigos.sort, { ascending: state.artigos.asc }).range(from, to);

  const { data, count, error } = await q;
  if (error) { showError(body, 7, error.message); return; }

  updateCount('cnt-artigos', count);
  if (!data || data.length === 0) { showEmpty(body, 7, 'Nenhum artigo encontrado.'); return; }

  body.innerHTML = '';
  data.forEach(row => {
    const tr = document.createElement('tr');
    tr.id = `ar-row-${row.id}`;
    tr.innerHTML = `
      <td><button class="expand-btn" onclick="toggleDetail(${row.id})" title="Ver detalhes">▶</button></td>
      <td style="max-width:340px;"><strong style="display:block;line-height:1.4">${esc(row.titulo||'—')}</strong></td>
      <td>${row.ano ?? '—'}</td>
      <td style="max-width:180px;font-size:.8rem;color:var(--muted)">${esc(row.source_title||'—')}</td>
      <td>${row.qtd_citacoes ?? '—'}</td>
      <td>${row.tipo_documento ? `<span class="badge badge-blue">${esc(row.tipo_documento)}</span>` : '—'}</td>
      <td>${row.tipo_acesso ? `<span class="badge ${row.tipo_acesso==='Open Access'?'badge-green':'badge-gray'}">${esc(row.tipo_acesso)}</span>` : '—'}</td>
    `;
    body.appendChild(tr);

    const det = document.createElement('tr');
    det.id = `ar-det-${row.id}`;
    det.className = 'detail-row';
    det.style.display = 'none';
    det.innerHTML = `<td colspan="7"><div id="det-content-${row.id}"><div class="state-box" style="padding:20px"><div class="spinner"></div></div></div></td>`;
    body.appendChild(det);
  });

  renderPagination('pg-artigos', count, page, loadArtigos);
}

async function toggleDetail(id) {
  const det = document.getElementById(`ar-det-${id}`);
  const btn = document.querySelector(`#ar-row-${id} .expand-btn`);
  if (det.style.display !== 'none') {
    det.style.display = 'none';
    btn.textContent = '▶';
    return;
  }
  det.style.display = '';
  btn.textContent = '▼';

  // load detail
  const [artRes, autores, keywords] = await Promise.all([
    sb.from('artigo').select('*').eq('id', id).single(),
    sb.from('artigo_autor').select('autor(*)').eq('id_artigo', id),
    sb.from('artigo_palavrachave').select('palavras_chaves(*)').eq('id_artigo', id),
  ]);
  const a = artRes.data;
  const autList = (autores.data||[]).map(x=>x.autor?.nome_completo||x.autor?.nome||'').filter(Boolean);
  const kwList  = (keywords.data||[]).map(x=>x.palavras_chaves?.palavra_chave||'').filter(Boolean);

  document.getElementById(`det-content-${id}`).innerHTML = `
    <div class="detail-grid">
      <div class="detail-item"><label>DOI</label><span>${a.doi ? `<a class="detail-link" href="https://doi.org/${esc(a.doi)}" target="_blank">${esc(a.doi)}</a>` : '—'}</span></div>

/* ─────────────────────────────────────────
   AUTORES
───────────────────────────────────────── */
async function loadAutores(page = 1) {
  if (!sb) return;
  state.autores.page = page;
  const body = document.getElementById('body-autores');
  body.innerHTML = `<tr><td colspan="4"><div class="state-box"><div class="spinner"></div><p>Carregando…</p></div></td></tr>`;

  const search = document.getElementById('search-autores').value.trim();
  const from   = (page - 1) * PAGE_SIZE;
  const to     = from + PAGE_SIZE - 1;

  let q = sb.from('autor').select('*, artigo_autor(count)', { count: 'exact' });
  if (search) q = q.or(`nome.ilike.%${search}%,nome_completo.ilike.%${search}%`);
  q = q.order(state.autores.sort, { ascending: state.autores.asc }).range(from, to);

  const { data, count, error } = await q;
  if (error) { showError(body, 4, error.message); return; }

  updateCount('cnt-autores', count);
  if (!data || data.length === 0) { showEmpty(body, 4, 'Nenhum autor encontrado.'); return; }

  body.innerHTML = data.map(row => `
    <tr>
      <td style="font-size:.78rem;color:var(--muted);font-family:monospace">${esc(row.id)}</td>
      <td>${esc(row.nome||'—')}</td>
      <td>${esc(row.nome_completo||'—')}</td>
      <td><span class="badge badge-gray">${row.artigo_autor?.[0]?.count ?? 0} artigos</span></td>
    </tr>
  `).join('');

  renderPagination('pg-autores', count, page, loadAutores);
}

/* ─────────────────────────────────────────
   SORTING
───────────────────────────────────────── */
function sortTable(tab, col) {
  if (state[tab].sort === col) state[tab].asc = !state[tab].asc;
  else { state[tab].sort = col; state[tab].asc = true; }
  const loaders = { artigos: loadArtigos, autores: loadAutores, keywords: loadKeywords, referencias: loadReferencias };
  loaders[tab](1);
}

/* ─────────────────────────────────────────
   PAGINATION
───────────────────────────────────────── */
function renderPagination(containerId, total, current, loader) {
  const el = document.getElementById(containerId);
  const pages = Math.ceil(total / PAGE_SIZE);
  if (pages <= 1) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const start = (current - 1) * PAGE_SIZE + 1;
  const end   = Math.min(current * PAGE_SIZE, total);

  let btns = '';
  // prev
  btns += `<button class="page-btn" onclick="(${loader.name})(${current-1})" ${current===1?'disabled':''}>‹</button>`;
  // pages
  const range = getPageRange(current, pages);
  range.forEach(p => {
    if (p === '…') btns += `<span style="padding:5px 4px;color:var(--muted)">…</span>`;
    else btns += `<button class="page-btn ${p===current?'current':''}" onclick="(${loader.name})(${p})">${p}</button>`;
  });
  // next
  btns += `<button class="page-btn" onclick="(${loader.name})(${current+1})" ${current===pages?'disabled':''}>›</button>`;

  el.innerHTML = `<span>${start}–${end} de ${total.toLocaleString('pt-BR')}</span><div class="page-btns">${btns}</div>`;
}

function getPageRange(current, total) {
  if (total <= 7) return Array.from({length:total},(_,i)=>i+1);
  if (current <= 4) return [1,2,3,4,5,'…',total];
  if (current >= total - 3) return [1,'…',total-4,total-3,total-2,total-1,total];
  return [1,'…',current-1,current,current+1,'…',total];
}

/* ─────────────────────────────────────────
   TABS
───────────────────────────────────────── */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

/* ─────────────────────────────────────────
   HELPERS
───────────────────────────────────────── */
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showEmpty(body, cols, msg) {
  body.innerHTML = `<tr><td colspan="${cols}"><div class="state-box">
    <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-3-3v6m-8 4h18a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    <p>${msg}</p></div></td></tr>`;
}

function showError(body, cols, msg) {
  body.innerHTML = `<tr><td colspan="${cols}"><div class="state-box" style="color:var(--danger)">
    <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="1.5"/><path stroke-linecap="round" stroke-width="1.5" d="M12 8v4m0 4h.01"/></svg>
    <p>Erro: ${esc(msg)}</p></div></td></tr>`;
}

function updateCount(id, count) {
  document.getElementById(id).textContent = (count ?? 0).toLocaleString('pt-BR');
}

function debounce(fn, delay) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
}
